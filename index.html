<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eliza Salazar · House Manager</title>
<meta name="description" content="Experienced House Manager trusted by Houston families.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#FACB67;
    --pink:#FF21A0;
    --cream:#FFFAF3;
    --blush:#FFE9F5;
    --ink:#2E1F2A;
    --muted:#8C7884;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Montserrat',sans-serif;
    background:
      radial-gradient(circle at 85% 8%, var(--blush) 0%, transparent 42%),
      radial-gradient(circle at 8% 92%, #FFF3DC 0%, transparent 45%),
      var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 20px;
  }
  .card{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  .avatar-wrap{
    position:relative;
    width:196px;height:196px;
    margin:0 auto 26px;
  }
  .avatar-wrap::before{
    content:"";
    position:absolute;inset:-11px;
    border-radius:50%;
    background:conic-gradient(from 210deg, var(--gold), var(--pink), var(--gold));
    animation:spin 14s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .avatar-wrap::before{animation:none}
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{
    position:relative;
    width:196px;height:196px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid var(--cream);
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:44px;
    letter-spacing:.5px;
    line-height:1.05;
  }
  .role{
    margin-top:10px;
    font-size:13px;
    font-weight:600;
    letter-spacing:5px;
    color:var(--pink);
    text-transform:uppercase;
  }
  .rule{
    width:64px;height:3px;
    background:var(--gold);
    border-radius:2px;
    margin:18px auto;
  }
  .summary{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:20px;
    line-height:1.5;
    color:#4A3742;
    padding:0 6px;
  }
  .services{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
    margin:24px 0 30px;
  }
  .chip{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.4px;
    padding:9px 16px;
    border-radius:999px;
    background:#fff;
    border:1.5px solid var(--gold);
    color:var(--ink);
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:17px 20px;
    border-radius:999px;
    font-family:'Montserrat',sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:.6px;
    text-decoration:none;
    cursor:pointer;
    border:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{
    background:var(--pink);
    color:#fff;
    box-shadow:0 10px 26px rgba(255,33,160,.32);
    margin-bottom:14px;
  }
  .btn-primary:hover{box-shadow:0 12px 30px rgba(255,33,160,.45)}
  .btn-secondary{
    background:#fff;
    color:var(--ink);
    border:2px solid var(--gold);
  }
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .phone{
    margin-top:26px;
    font-size:15px;
    font-weight:600;
    letter-spacing:1px;
    color:var(--muted);
  }
  .phone a{color:var(--pink);text-decoration:none}
  .foot{
    margin-top:8px;
    font-size:12px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--muted);
  }
</style>
</head>
